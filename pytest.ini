[pytest]
; Them thu muc goc project (noi chua thu muc app/) vao sys.path khi chay pytest.
; Neu khong co dong nay, chay lenh "pytest tests/ -v" tren Windows/PowerShell se
; bao loi "ModuleNotFoundError: No module named 'app'" vi pytest chi tu dong them
; thu muc chua conftest.py (tests/) vao sys.path, khong them thu muc cha (project root).
; Chay "python -m pytest tests/ -v" thi khong bi loi nay (python -m tu them cwd vao
; sys.path), nhung de an toan va nhat quan giua cac cach chay, khai bao ro o day.
pythonpath = .
testpaths = tests
